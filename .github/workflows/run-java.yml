name: Run All Java Problems

on:
  push:
    branches:
      - DSA  # your working branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Compile all Java files
    - name: Compile All Java Files
      run: javac src/Array_Problems/*.java

    # Step 4: Run each Java file
    - name: Run All Java Programs
      run: |
        for FILE in src/Array_Problems/*.java; do
          CLASS_NAME=$(basename "$FILE" .java)
          echo "Running $CLASS_NAME ..."
          java -cp src Array_Problems.$CLASS_NAME
          echo "------------------------"
        done
