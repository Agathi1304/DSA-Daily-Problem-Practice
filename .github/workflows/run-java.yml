name: Run All Java Problems

on:
  push:
    branches:
      - DSA   # or your working branch name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile All Java Files
      run: |
        find src -name "*.java" > sources.txt
        javac @sources.txt

    - name: Run All Java Classes
      run: |
        for FILE in $(find src -name "*.java"); do
          FILE_PATH=${FILE#src/}
          CLASS_NAME=${FILE_PATH%.java}
          CLASS_NAME=${CLASS_NAME//\//.}
          echo "Running $CLASS_NAME ..."
          java -cp src $CLASS_NAME
          echo "------------------------"
        done
